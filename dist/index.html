<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IKUNANCE - Sign Alert Master</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <script>
      ;(() => {
        if (window.__ikunBootGuardInstalled) return
        window.__ikunBootGuardInstalled = true
        window.__ikunBootErrors = []

        const remember = (event) => {
          const detail = event?.reason || event?.error || event?.message || event
          window.__ikunBootErrors.push(String(detail && detail.stack ? detail.stack : detail))
          if (window.__ikunBootErrors.length > 8) window.__ikunBootErrors.shift()
        }

        window.addEventListener('error', remember)
        window.addEventListener('unhandledrejection', remember)

        window.setTimeout(() => {
          const root = document.getElementById('root')
          if (!root || root.children.length > 0) return

          const wrap = document.createElement('div')
          wrap.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020812;color:#dbeafe;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;'
          const panel = document.createElement('div')
          panel.style.cssText = 'max-width:520px;border:1px solid #18304f;border-radius:12px;background:#07111f;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.35);'
          const title = document.createElement('div')
          title.style.cssText = 'font-size:22px;font-weight:800;margin-bottom:10px;'
          title.textContent = 'IKUNANCE 加载异常'
          const body = document.createElement('div')
          body.style.cssText = 'color:#9fb3c8;line-height:1.7;margin-bottom:18px;'
          body.textContent = '页面脚本没有正常启动。请先刷新；如果仍然出现，请保留当前页面并检查服务器静态资源和浏览器控制台。'
          const button = document.createElement('button')
          button.type = 'button'
          button.textContent = '刷新页面'
          button.style.cssText = 'height:38px;padding:0 16px;border-radius:8px;border:1px solid #38bdf8;background:#0b79d0;color:white;font-weight:700;cursor:pointer;'
          button.onclick = () => window.location.reload()
          panel.appendChild(title)
          panel.appendChild(body)
          panel.appendChild(button)
          wrap.appendChild(panel)
          root.appendChild(wrap)
        }, 8000)
      })()
    </script>
    <script src="/assets/ikun-runtime-fixes.js?v=20260622-alert-persist" defer></script>
    <script type="module" crossorigin src="/assets/index-D5EUXf1F.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-bUfODngu.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
